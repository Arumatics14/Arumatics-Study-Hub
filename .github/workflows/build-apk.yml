name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install
      - name: Prepare www folder
        run: |
          mkdir -p www
          cp index.html www/
      - name: Add Android platform
        run: |
          if [ ! -d android ]; then npx cap add android; fi
      - name: Generate icons
        run: |
          mkdir -p resources
          cp icon.png resources/icon.png
          npm install @capacitor/assets --save-dev
          npx capacitor-assets generate --android
          - name: Embed fonts
        run: |
          npm install @fontsource/plus-jakarta-sans @fontsource/hind-siliguri
          mkdir -p fonts
          for w in 400 600 700; do
            cp node_modules/@fontsource/plus-jakarta-sans/files/plus-jakarta-sans-latin-$w-normal.woff2 fonts/
            cp node_modules/@fontsource/hind-siliguri/files/hind-siliguri-latin-$w-normal.woff2 fonts/
            cp node_modules/@fontsource/hind-siliguri/files/hind-siliguri-bengali-$w-normal.woff2 fonts/
          done
      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
