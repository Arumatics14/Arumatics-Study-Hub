localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};\nconst fmt=s=>{s=Math.max(0,s);const m=Math.floor(s/60),x=s%60;return bd(String(m).padStart(2,'0'))+':'+bd(String(x).padStart(2,'0'))};\nconst dur=n=>n*SEC_PER_Q;\nconst durTxt=n=>{const s=dur(n),m=Math.floor(s/60),x=s%60;return bd(m)+' মিনিট'+(x?' '+bd(x)+' সেকেন্ড':'')};\nconst fix=t=>t.replace(/_{2,}/g,'<span class=\"blank\"><\/span>');\n\nfunction setMode(m){mode=m;$('tPrac').classList.toggle('on',m==='practice');$('tQuiz').classList.toggle('on',m==='quiz');renderHome()}\nfunction ask(msg,yes,cb){$('mMsg').textContent=msg;$('mYes').textContent=yes;$('modal').classList.remove('hide');\n  $('mNo').onclick=()=>$('modal').classList.add('hide');$('mYes').onclick=()=>{$('modal').classList.add('hide');cb()}}\nfunction setCnt(n){cnt=n;renderHome()}\nfunction setOrd(o){ord=o;renderHome()}\nfunction pickList(s,e){let a=DATA.slice(s-1,e);if(ord==='rand')a=[...a].sort(()=>Math.random()-.5);return a.slice(0,Math.min(cnt,a.length))}\nfunction renderHome(){\n  $('cntChips').innerHTML=[10,20,30,50,100].map(n=>`<button class=\"chip ${cnt===n?'on':''}\" onclick=\"setCnt(${n})\">${bd(n)}টি<\/button>`).join('');\n  $('ordChips').innerHTML=[['rand','🔀 র‍্যান্ডম'],['seq','🔢 ক্রমানুসারে']].map(([k,l])=>`<button class=\"chip ${ord===k?'on':''}\" onclick=\"setOrd('${k}')\">${l}<\/button>`).join('');\n  $('ruleBox').innerHTML=mode==='quiz'\n   ?'<b>⏱️ কুইজের নিয়ম<\/b><ul class=\"rules\"><li>প্রতিটি প্রশ্নে সময় ৩৬ সেকেন্ড হিসাবে মোট সময় (১০০টি = ৬০ মিনিট)<\/li><li>ভুল উত্তরে <b>−০.২৫<\/b> নম্বর, সঠিকে +১, উত্তর না দিলে ০<\/li><li>একবার উত্তর দিলে আর <b>পরিবর্তন করা যাবে না<\/b><\/li><li>পরীক্ষার সময় সঠিক উত্তর দেখা যাবে না<\/li><li>যেকোনো সময় \"পরীক্ষা শেষ করুন\" চাপা যাবে; সময় শেষ হলে অটো জমা হবে<\/li><li>শেষে বাংলা ব্যাখ্যাসহ রিভিউ পাবেন<\/li><\/ul>'\n   :'<b>📝 প্র্যাকটিস মোড<\/b><ul class=\"rules\"><li>উত্তর বাছাই করলেই সঙ্গে সঙ্গে সঠিক/ভুল ও বাংলা ব্যাখ্যা দেখাবে<\/li><li>সময়ের চাপ নেই, নেগেটিভ মার্ক নেই<\/li><\/ul>';\n  const sets=[];for(let s=1;s<=501;s+=100){const e=Math.min(s+99,501);if(s===401)sets.push([401,501]);else sets.push([s,e]);}\n  $('sets').innerHTML=sets.map(([s,e])=>{const tot=e-s+1,n=Math.min(cnt,tot),b=store.get('best_'+s+'_'+e+'_'+n);\n   return `<button class=\"set\" onclick=\"startSet(${s},${e})\"><b>প্রশ্ন ${bd(s)} – ${bd(e)}<\/b><span>${bd(n)}টি MCQ (মোট ${bd(tot)}টির মধ্যে)<\/span><br>${mode==='quiz'?`<span class=\"time\">⏱ ${durTxt(n)}<\/span>`:''}${b!=null?`<span class=\"best\">সেরা স্কোর: ${bd(b)}<\/span>`:''}<\/button>`}).join('');\n  updRange();\n}\nfunction updRange(){const f=+$('from').value,t=+$('to').value;if(f>=1&&t>=f&&t<=501)$('rangeTime').innerHTML=mode==='quiz'?`<span class=\"time\">⏱ ${durTxt(Math.min(cnt,t-f+1))}<\/span>`:'';else $('rangeTime').textContent=''}\n$('from').oninput=$('to').oninput=updRange;\nfunction startSet(s,e){const l=pickList(s,e);begin(l,`প্রশ্ন ${bd(s)}–${bd(e)}`,'best_'+s+'_'+e+'_'+l.length)}\nfunction startRange(){const f=+$('from').value,t=+$('to').value;if(!(f>=1&&t>=f&&t<=501)){ask('সঠিক রেঞ্জ দিন (১–৫০১)','ঠিক আছে',()=>{});return}startSet(f,t)}\nfunction startRandom(){const a=[...DATA].sort(()=>Math.random()-.5).slice(0,cnt);begin(a,'র‍্যান্ডম '+bd(cnt),null)}\n\nfunction begin(list,label,key){\n  cur={list,ans:Array(list.length).fill(null),i:0,ended:false,label,key,mode,start:Date.now(),left:dur(list.length)};\n  $('home').classList.add('hide');$('result').classList.add('hide');$('exam').classList.remove('hide');\n  $('eTitle').textContent=label;$('eMode').textContent=mode==='quiz'?'• কুইজ':'• প্র্যাকটিস';\n  $('timer').classList.toggle('hide',mode!=='quiz');\n  $('finish').textContent=mode==='quiz'?'পরীক্ষা শেষ করুন':'প্র্যাকটিস শেষ';\n  if(mode==='quiz'){tick();cur.tid=setInterval(tick,1000)}\n  render();window.scrollTo(0,0);\n}\nfunction tick(){\n  const el=Math.floor((Date.now()-cur.start)/1000);cur.left=dur(cur.list.length)-el;\n  const t=$('timer');t.textContent='⏱ '+fmt(cur.left);t.classList.toggle('low',cur.left<=300);\n  if(cur.left<=0){clearInterval(cur.tid);submit(true)}\n}\nfunction render(){\n  const q=cur.list[cur.i],a=cur.ans[cur.i],prac=cur.mode==='practice';\n  $('qn').textContent=`প্রশ্ন ${bd(cur.i+1)} / ${bd(cur.list.length)}  (মূল নং ${bd(q.n)})`;\n  let qt=fix(q.q);if(!/blank/.test(qt))qt+=' <span class=\"blank\"><\/span>';\n  $('qt').innerHTML=qt;\n  $('opts').innerHTML=q.o.map((o,k)=>{\n    let c='opt',dis=a!==null?'disabled':'';\n    if(a!==null){if(prac){if(k===q.a)c+=' ok';else if(k===a)c+=' no'}else if(k===a)c+=' sel'}\n    return `<button class=\"${c}\" ${dis} onclick=\"pick(${k})\"><span class=\"l\">${LET[k].toUpperCase()}<\/span><span>${o}${(prac&&a!==null&&k===q.a)?` <span class=\"bnm\">(${q.b})<\/span>`:''}<\/span><\/button>`}).join('');\n  $('exp').innerHTML=(prac&&a!==null)?expHTML(q,a):'';\n  $('prev').disabled=cur.i===0;$('next').disabled=cur.i===cur.list.length-1;\n  $('prog').style.width=(cur.ans.filter(x=>x!==null).length/cur.list.length*100)+'%';\n}\nfunction expHTML(q,a,reveal){\n  const right=a===q.a;const W=reveal?wrapEN:(x=>x);\n  return `<div class=\"exp ${right?'':'bad'}\"><p><b>${right?'✅ সঠিক!':(a===null?'⏭️ উত্তর দেননি':'❌ ভুল')}<\/b> — সঠিক উত্তর: <b>${LET[q.a].toUpperCase()}. ${W(q.o[q.a])} <span class=\"bnm\">(${q.b})<\/span><\/b><\/p><p><b>বাংলা অর্থ:<\/b> ${q.b}<\/p><p><b>ব্যাখ্যা:<\/b> ${q.f}<\/p><p class=\"en\">${W(q.e)}<\/p><\/div>`;\n}\nfunction pick(k){\n  if(cur.ended||cur.ans[cur.i]!==null)return; // একবার দিলে পরিবর্তন নয়\n  cur.ans[cur.i]=k;render();\n}\nfunction go(d){cur.i=Math.min(cur.list.length-1,Math.max(0,cur.i+d));render();window.scrollTo(0,0)}\nfunction finishExam(){\n  const done=cur.ans.filter(x=>x!==null).length,tot=cur.list.length;\n  const msg=cur.mode==='quiz'?`আপনি ${bd(tot)}টির মধ্যে ${bd(done)}টির উত্তর দিয়েছেন। পরীক্ষা শেষ করবেন? (আর ফেরা যাবে না)`:`প্র্যাকটিস শেষ করে ফলাফল দেখবেন?`;\n  ask(msg,'হ্যাঁ, শেষ করুন',()=>{clearInterval(cur.tid);submit(false)})\n}\nfunction quitExam(){ask('পরীক্ষা বাদ দিয়ে হোমে ফিরবেন? কোনো ফলাফল সেভ হবে না।','হ্যাঁ, বাদ দিন',()=>{clearInterval(cur.tid);cur.ended=true;home()})}\nfunction submit(auto){\n  cur.ended=true;clearInterval(cur.tid);\n  const used=Math.min(dur(cur.list.length),Math.floor((Date.now()-cur.start)/1000));\n  let c=0,w=0,s=0;cur.list.forEach((q,i)=>{const a=cur.ans[i];if(a===null)s++;else if(a===q.a)c++;else w++});\n  const quiz=cur.mode==='quiz',neg=quiz?w*NEG:0,score=c-neg;\n  cur.res={c,w,s,neg,score,used};\n  if(quiz&&cur.key){const b=store.get(cur.key);if(b==null||score>b)store.set(cur.key,score)}\n  $('exam').classList.add('hide');$('result').classList.remove('hide');\n  $('rScore').textContent=`${bd(+score.toFixed(2))} / ${bd(cur.list.length)}`;\n  $('rSub').textContent=(auto?'⏰ সময় শেষ — অটো জমা হয়েছে • ':'')+(quiz?'নেগেটিভ মার্কিং: ভুল প্রতি −০.২৫':'প্র্যাকটিস (নেগেটিভ মার্ক নেই)');\n  $('rStats').innerHTML=[['✅ সঠিক',c],['❌ ভুল',w],['⏭️ স্কিপ',s],['➖ কাটা নম্বর',quiz?'−'+bd(+neg.toFixed(2)):'০'],['⏱ সময় লেগেছে',fmt(used)],['🎯 নির্ভুলতা',bd(c+w?Math.round(c/(c+w)*100):0)+'%']].map(([a,b])=>`<div class=\"st\"><b>${typeof b==='number'?bd(b):b}<\/b>${a}<\/div>`).join('');\n  filt('all');window.scrollTo(0,0);\n}\nfunction filt(t){\n  $('review').innerHTML=cur.list.map((q,i)=>{\n    const a=cur.ans[i],ok=a===q.a;\n    if(t==='wrong'&&ok)return'';\n    const tag=a===null?'<span class=\"tag sk\">স্কিপ<\/span>':ok?'<span class=\"tag ok\">সঠিক<\/span>':'<span class=\"tag no\">ভুল<\/span>';\n    let qt=fix(wrapEN(q.q));if(!/blank/.test(qt))qt+=' <span class=\"blank\"><\/span>';\n    return `<div class=\"card\"><div class=\"qn\">প্রশ্ন ${bd(i+1)} (মূল নং ${bd(q.n)}) ${tag}<\/div><div class=\"qt\">${qt}<\/div>`+\n      q.o.map((o,k)=>`<div class=\"opt ${k===q.a?'ok':(k===a?'no':'')}\" style=\"cursor:default\"><span class=\"l\">${LET[k].toUpperCase()}<\/span><span>${wrapEN(o)}<\/span>${k===a?'<small>(আপনার উত্তর)<\/small>':''}<\/div>`).join('')+\n      expHTML(q,a,true)+`<\/div>`}).join('')||'<div class=\"card\">সবগুলো সঠিক! 🎉<\/div>';\n}\nfunction home(){closeSheet();$('result').classList.add('hide');$('exam').classList.add('hide');$('home').classList.remove('hide');renderHome();window.scrollTo(0,0)}\nfunction retry(){const l=cur.list,lb=cur.label,k=cur.key;begin(l,lb,k)}\nwindow.addEventListener('beforeunload',e=>{if(cur&&!cur.ended&&!$('exam').classList.contains('hide')){e.preventDefault();e.returnValue=''}});\n\n\nconst wrapEN=t=>t.replace(/[A-Za-z][A-Za-z'-]*/g,m=>`<span class=\"w\">${m}<\/span>`);\nconst localDict={};DATA.forEach(q=>{localDict[q.o[q.a].toLowerCase()]=q.b});\nfunction closeSheet(){$('sheet').classList.remove('open')}\nasync function lookup(w){\n  const k=w.toLowerCase().replace(/^[-']+|[-']+$/g,'');\n  const c=store.get('dict_'+k);if(c)return c;\n  const q=encodeURIComponent(k);\n  const tmo=(u)=>{const ac=typeof AbortController!=='undefined'?new AbortController():null;const t=setTimeout(()=>ac&&ac.abort(),8000);return fetch(u,ac?{signal:ac.signal}:{}).finally(()=>clearTimeout(t))};\n  const tries=[\n    async()=>{const j=await (await tmo('https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=bn&dt=t&dt=bd&q='+q)).json();\n      const main=(j[0]||[]).map(x=>x[0]).join('');const alts=[];\n      (j[1]||[]).forEach(p=>{(p[1]||[]).slice(0,3).forEach(t=>{if(t!==main&&alts.indexOf(t)<0&&alts.length<5)alts.push(t)})});\n      if(!main)throw 0;return{m:main,a:alts}},\n    async()=>{const j=await (await tmo('https://clients5.google.com/translate_a/t?client=dict-chrome-ex&sl=en&tl=bn&q='+q)).json();\n      let m=Array.isArray(j)?(Array.isArray(j[0])?j[0][0]:j[0]):(j.sentences&&j.sentences[0]&&j.sentences[0].trans);\n      if(!m)throw 0;return{m:m,a:[]}},\n    async()=>{const j=await (await tmo('https://lingva.ml/api/v1/en/bn/'+q)).json();\n      if(!j.translation)throw 0;return{m:j.translation,a:[]}},\n    async()=>{const j=await (await tmo('https://api.mymemory.translated.net/get?q='+q+'&langpair=en|bn')).json();\n      const m=j&&j.responseData&&j.responseData.translatedText;\n      if(!m||/MYMEMORY|INVALID|QUERY LENGTH/i.test(m))throw 0;return{m:m,a:[]}}\n  ];\n  const res=await new Promise(resolve=>{let left=tries.length,done=false;\n    tries.forEach(f=>{f().then(r=>{if(!done){done=true;resolve(r)}}).catch(()=>{if(--left===0&&!done)resolve(null)})})});\n  if(res)store.set('dict_'+k,res);\n  return res;\n}\nasync function showWord(w){\n  const k=w.toLowerCase();\n  $('sW').textContent=w;$('sB').textContent='…';$('sA').textContent='';\n  $('sheet').classList.add('open');\n  if(localDict[k]){$('sB').textContent=localDict[k];$('sA').textContent='(বইয়ের অর্থ)'}\n  const r=await lookup(w);\n  if($('sW').textContent!==w)return;\n  if(r){\n    if(localDict[k]){$('sA').textContent='অন্যান্য অর্থ: '+[r.m].concat(r.a).join(', ')}\n    else{$('sB').textContent=r.m;$('sA').textContent=r.a.length?'অন্যান্য অর্থ: '+r.a.join(', '):''}\n  }else if(!localDict[k]){$('sB').textContent='অর্থ আনা যায়নি';$('sA').innerHTML='ইন্টারনেট সংযোগ লাগবে (Claude অ্যাপের প্রিভিউতে বাইরের সংযোগ ব্লক থাকে — GitHub Pages বা সরাসরি ব্রাউজারে খুলুন)। <a style=\"color:#f5c451\" target=\"_blank\" rel=\"noopener\" href=\"https://translate.google.com/?sl=en&tl=bn&op=translate&text='+encodeURIComponent(w)+'\">Google Translate-এ দেখুন ↗<\/a>'}\n}\ndocument.addEventListener('click',e=>{\n  const w=e.target.closest&&e.target.closest('#review .w');\n  if(w){showWord(w.textContent);return}\n  if(!e.target.closest('#sheet'))closeSheet();\n});\nrenderHome();\n<\/script>\n<\/body>\n<\/html>\n", "an": "<!DOCTYPE html><html lang=\"bn\"><head><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\"><meta name=\"color-scheme\" content=\"dark\"><title>GRE Analogy Practice<\/title>\n<link href=\"https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;700;800&display=swap\" rel=\"stylesheet\">\n<style>\n:root{box-sizing:border-box;padding- কার একটি মধ্যম আয়ের ভবিষ্যতের স্বপ্ন দেখছে।\nলুকানো|চোরাগোপ্তা,লুকিয়ে করা,আড়াল করা|বিশেষজ্ঞরা ব্যাংকিং ব্যবস্থায় লুকানো ঝুঁকির বিষয়ে সতর্ক করছেন।\nসুপ্ত|অন্তর্লীন,শীতনিদ্রায় থাকা|উত্তেজনা সুপ্ত আছে, তবে আবার মাথাচাড়া দিতে পারে।\nদক্ষতা|যোগ্যতা,নৈপুণ্য|সফল কূটনীতির জন্য প্রচুর দক্ষতা দরকার।\nশক্তিশালী করা|জোরদার করা,সুদৃঢ় করা,মজবুত করা,বাড়িয়ে তোলা|সংস্কারের লক্ষ্য ব্যাংকিং খাতকে শক্তিশালী করা।\nনেতিবাচক|ভয়াবহ,ধ্বংসাত্মক,বিপর্যয়কর|জলবায়ু পরিবর্তনের নেতিবাচক প্রভাব পড়ছে কৃষিতে।\nস্বীকার করা|স্বীকৃতি দেওয়া|মন্ত্রী স্বীকার করেছেন, পরিকল্পনাটি ব্যর্থ হয়েছে।\nঘাটতি|অভাব,দুষ্প্রাপ্যতা,শূন্য/বিহীন|দক্ষ কর্মীর ঘাটতি প্রবৃদ্ধিকে বাধাগ্রস্ত করছে।\nমনোমুগ্ধকর|আকর্ষণীয়,কৌতূহলজাগানিয়া,মন্ত্রমুগ্ধকর|প্রতিবেদনে গ্রামীণ উদ্যোক্তাদের একটি মনোমুগ্ধকর চিত্র উঠে এসেছে।\nগল্প|বর্ণনা/আখ্যান,বিবরণ|চলচ্চিত্রটি এক সংগ্রামী কৃষকের গল্প বলে।\nকার্যক্রম|কর্মসাধনা,কাজকর্ম|রাজনৈতিক অস্থিরতা ব্যবসায়িক কার্যক্রম ব্যাহত করেছে।\nঅনেক|বহুমাত্রিক,নানা ধরনের,অগণিত|অনেক কারণ মন্দাকে চালিত করছে।\nছোট|প্রান্তিক/সামান্য,ন্যূনতম,উপেক্ষণীয়|বাজেটে স্বাস্থ্যখাতে কেবল সামান্য বরাদ্দ রাখা হয়েছে।\nবিশাল|যথেষ্ট/পর্যাপ্ত,অপরিমেয়,মহাকায়|প্রকল্পটিতে বিশাল বিনিয়োগ জড়িত।\nদ্রুত|ত্বরিত ও দক্ষ,হঠাৎ/খাড়া|কেলেঙ্কারি নিয়ে সরকার দ্রুত ব্যবস্থা নেওয়ার প্রতিশ্রুতি দিয়েছে।\nযথেষ্ট|পর্যাপ্ত,যথেষ্ট হওয়া|চাহিদা মেটাতে বরাদ্দ যথেষ্ট নয়।\nপ্রভাব|দাপট,আধিপত্য|নীতির ওপর বড় ব্যবসায়ী গোষ্ঠীগুলোর প্রচণ্ড প্রভাব রয়েছে।\nক্ষতিকর|ক্ষতিকারক,বৈরী,সর্বনাশা|নিয়ন্ত্রণহীন ঋণ অর্থনীতির জন্য ক্ষতিকর।\nসহায়ক|অনুকূল,সুবিধাজনক,হিতকর|স্থিতিশীল বিনিময় হার রপ্তানিকারকদের জন্য সহায়ক।\nশুরু|আরম্ভ করা,উদ্বোধন করা,সূচনা ঘটানো|নতুন মেট্রোরেল লাইনটি আগামী মাসে চালু হবে।\nশেষ|সমাপ্ত করা,চূড়ান্ত পরিণতি পাওয়া,সমাপ্তি|আলোচনা একটি যুগান্তকারী চুক্তিতে শেষ হয়েছে।\nব্যবহার করা|কাজে লাগানো,সদ্ব্যবহার করা,সুযোগ কাজে লাগানো|খরচ কমাতে প্রতিষ্ঠানগুলোকে প্রযুক্তি ব্যবহার করতে হবে।\nএড়ানো|এড়িয়ে যাওয়া,ফাঁকি দেওয়া,আইন বা বাধা এড়িয়ে যাওয়া|কিছু প্রতিষ্ঠান আইনের ফাঁক গলে কর এড়ায়।\nবেছে নেওয়া|বেছে নেওয়া,মনোনীত করা,আলাদা করে চিহ্নিত করা|অনেক স্নাতক বিদেশে চাকরি বেছে নেন।\nবাস্তবায়ন করা|সম্পাদন করা,কার্যকর করা,পরিচালনা করা|সরকারকে সংস্কার পরিকল্পনা বাস্তবায়ন করতে হবে।\nউন্নত করা|উৎকর্ষ সাধন করা,পরিমার্জন করা,মান বাড়ানো|বিনিয়োগ পরিবেশ উন্নত করার উদ্যোগ থমকে গেছে।\nঅবনতি ঘটানো|আরও খারাপ করা,জটিল করে তোলা,ক্রমে খারাপ হওয়া|নীতিগত দেরি জ্বালানি সংকট আরও বাড়াবে।\nএকমত হওয়া|সম্মত হওয়া,সায় দেওয়া,সর্বসম্মত|অর্থনীতিবিদেরা একমত যে, সংস্কার ফেলে রাখা যাবে না।\nবিরোধ|মতবিরোধ,অনৈক্য,দ্বিধা/দোলাচল|মজুরি নিয়ে বিরোধ উৎপাদন থামিয়ে দিয়েছে।\nভাবা/পরিকল্পনা করা|গভীরভাবে ভাবা,সুচিন্তিত আলোচনা করা,পরিকল্পনা প্রণয়ন করা|মন্ত্রিসভা ভর্তুকি আরও কমানোর কথা ভাবছে।\nগুরুত্ব দেওয়া|জোর দেওয়া,অগ্রাধিকার দেওয়া,বিশেষভাবে ফুটিয়ে তোলা|বাজেটে কর্মসংস্থান সৃষ্টিতে গুরুত্ব দেওয়া উচিত।\nস্পষ্টভাবে|সুস্পষ্টভাবে,দৃশ্যত,দ্ব্যর্থহীনভাবে|তথ্য স্পষ্টভাবে মন্দার ইঙ্গিত দিচ্ছে।\nসংক্ষিপ্ত|সংক্ষিপ্ত,সংক্ষিপ্ত ও সারগর্ভ,সারগর্ভ|মন্ত্রণালয় একটি সংক্ষিপ্ত বিবৃতি দিয়েছে।\nপুরোনো|সেকেলে,অচল,প্রাচীন|দেশ এখনো পুরোনো কর ব্যবস্থার ওপর নির্ভর করছে।\nআধুনিক|সমসাময়িক,অত্যাধুনিক|বন্দরের আধুনিক সরঞ্জাম দরকার।\nজটিল|সূক্ষ্ম ও জটিল,পাঁচালো,গোলকধাঁধার মতো জটিল|ছোট প্রতিষ্ঠানের জন্য কর বিধি অতি জটিল।\nস্থায়ী|চিরন্তন,অমোচনীয়,চিরস্থায়ী|সংকট অর্থনীতিতে স্থায়ী ক্ষত রেখে গেছে।\nসাধারণ|সর্বব্যাপী,প্রচলিত,ব্যাপক|শিল্পাঞ্চলে বিদ্যুৎ বিভ্রাট সাধারণ ঘটনা।\nভিন্ন|সম্পূর্ণ আলাদা,পরস্পরবিরোধী,স্বতন্ত্র|পূর্বাভাস নিয়ে বিশ্লেষকদের ভিন্ন মত রয়েছে।\nকঠোর|কড়াকড়িপূর্ণ,কঠোর ও নিখুঁত,নির্মম|কেন্দ্রীয় ব্যাংক ঋণে কঠোর নিয়ম আরোপ করেছে।\nনমনীয়|বহুমুখী,খাপ খাওয়ানোর উপযোগী,স্থিতিস্থাপক|খাতটির একটি নমনীয় শ্রমনীতি দরকার।\nব্যবধান|বৈষম্য,ফাঁক,বিরতি|ধনী-গরিবের ব্যবধান বেড়েই চলেছে।\nদায়িত্ব|বাধ্যবাধকতা,দায়,বিশেষ অধিকার|ভোক্তাদের সুরক্ষা দেওয়া রাষ্ট্রের দায়িত্ব।\nঅপচয়|অপচয় করা,নিঃশেষ করা,ছড়িয়ে নষ্ট করা|দুর্বল পরিকল্পনা জনগণের অর্থের অপচয় ঘটায়।\nপ্রমাণ|সমর্থনসূচক প্রমাণ,প্রমাণ করা,সাক্ষ্য/নিদর্শন|সুশাসনে উন্নতির কোনো প্রমাণ নেই।\nযাচাই|নিবিড় পর্যবেক্ষণ করা,নিরীক্ষা করা,যাচাই-বাছাই করা|নিরীক্ষকেরা ব্যাংকগুলোর হিসাব যাচাই করবেন।\nঝুঁকি|সংকটময় বিপদ
